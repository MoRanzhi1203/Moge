[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moge"
version = "2.0.0"
description = "墨格 - 图像像素化处理器"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "MoRanzhi1203" }]
dependencies = [
    "numpy==2.0.2",
    "opencv-python-headless==4.11.0.86",
    "PyQt5==5.15.9",
    "PyQt5-sip==12.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyinstaller==6.11.1",
    "pip-audit>=2.7",
]

[project.scripts]
moge = "Moge.main:main"
moge-resources = "Moge.core.resources.cli:main"
moge-beads = "Moge.core.beads.acquire:main"

[tool.setuptools]
packages = ["Moge", "Moge.core", "Moge.core.modes", "Moge.core.resources", "Moge.core.beads", "Moge.exporters", "Moge.ui", "Moge.utils"]
package-dir = { "Moge" = ".", "Moge.core" = "core", "Moge.core.modes" = "core/modes", "Moge.core.resources" = "core/resources", "Moge.core.beads" = "core/beads", "Moge.exporters" = "exporters", "Moge.ui" = "ui", "Moge.utils" = "utils" }
include-package-data = true

[tool.setuptools.package-data]
Moge = ["assets/samples/**/*"]

[tool.ruff]
line-length = 120
target-version = "py39"
exclude = ["build", "dist", ".git", "__pycache__"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

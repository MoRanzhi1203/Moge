name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ruff
        run: pip install "ruff>=0.6"
      - name: Lint
        run: ruff check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest --cov=Moge.core --cov-report=term-missing --cov-fail-under=80

  build:
    name: Build package
    runs-on: windows-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Build with PyInstaller
        run: pyinstaller --noconfirm Moge.spec
      - name: Check artifact size
        shell: pwsh
        run: |
          $size = (Get-ChildItem dist/Moge -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host ("Artifact size: {0:N1} MB" -f ($size / 1MB))
          if ($size -gt 350MB) { throw "Artifact exceeds 350 MB" }
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moge-windows
          path: dist/Moge
          retention-days: 7

  security:
    name: Dependency audit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Audit runtime dependencies
        continue-on-error: true  # 发现漏洞时先上报，不阻塞主干修复
        run: pip-audit
